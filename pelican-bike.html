<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>海风骑行 · Pelican ride</title>
  <style>
    :root { color-scheme: light; --ink: #24463f; --sky: #d8eee8; --accent: #e16c54; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { overflow: hidden; background: var(--sky); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    main { position: relative; width: 100%; height: 100%; min-height: 340px; overflow: hidden; }
    .scene { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    header { position: absolute; top: max(30px, env(safe-area-inset-top)); left: 40px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
    .brand-mark { width: 34px; height: 34px; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    .edition { margin-top: 4px; font-size: 10px; font-weight: 600; color: #5b7970; }
    .corner { position: absolute; right: 40px; top: 37px; font-size: 11px; color: #52796c; }
    .caption { position: absolute; left: 40px; bottom: 37px; pointer-events: none; }
    .caption p { margin: 0 0 9px; font-family: Georgia, serif; font-size: 30px; font-style: italic; font-weight: 400; }
    .caption span { font-size: 11px; color: #607c66; }
    .controls { position: absolute; right: 40px; bottom: max(34px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 19px; padding: 0; height: 48px; }
    button { width: 46px; height: 46px; border: 1px solid #24463f30; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: #f8fbf0; cursor: pointer; transition: background .15s, transform .15s; touch-action: manipulation; }
    button:hover { background: #fff; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .play-icon, button[data-paused="true"] .pause-icon { display: none; }
    button[data-paused="true"] .play-icon { display: block; }
    .speed { display: flex; align-items: center; gap: 12px; }
    .speed svg { width: 19px; height: 19px; fill: none; stroke: #53745f; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    input[type="range"] { appearance: none; -webkit-appearance: none; background: transparent; width: 100px; height: 32px; margin: 0; cursor: pointer; accent-color: var(--ink); }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: #24463f38; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; background: var(--ink); border: 2px solid #f3f6df; border-radius: 50%; }
    input[type="range"]::-moz-range-track { height: 3px; background: #24463f38; }
    input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #f3f6df; border-radius: 50%; background: var(--ink); }
    output { min-width: 32px; font-size: 12px; font-variant-numeric: tabular-nums; }
    #restart { width: 36px; height: 36px; background: transparent; border: 0; }
    .divider { width: 1px; height: 23px; background: #24463f25; }
    @media (max-width: 600px) {
      header { top: max(24px, env(safe-area-inset-top)); left: 23px; gap: 9px; }
      h1 { font-size: 17px; }
      .brand-mark { width: 29px; height: 29px; }
      .corner { right: 24px; top: 30px; font-size: 10px; }
      .caption { left: 25px; bottom: 113px; }
      .caption p { font-size: 25px; margin-bottom: 7px; }
      .controls { right: 25px; left: 25px; bottom: max(29px, env(safe-area-inset-bottom)); justify-content: space-between; gap: 12px; }
      .speed { flex: 1; justify-content: center; }
      input[type="range"] { width: min(110px, 25vw); }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      header { top: 18px; left: 24px; }
      .corner { top: 24px; right: 24px; }
      .caption { bottom: 18px; left: 24px; }
      .caption p { font-size: 23px; }
      .controls { bottom: 16px; right: 24px; }
    }
    @media (max-width: 360px) { .corner { display: none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const scene = byId('scene');
      const toggle = byId('toggle');
      const speedInput = byId('speed');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'rider', 'shadow', 'crank', 'scarf-tail-back', 'scarf-tail-front', 'clouds', 'water', 'plants', 'road', 'front-plants'].map(id => [id, byId(id)]));
      const legs = ['rear', 'front'].map(side => ({
        outline: byId(side + '-leg-outline'), line: byId(side + '-leg-line'),
        foot: byId(side + '-foot'), pedal: byId(side + '-pedal'),
      }));
      let paused = reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previous = null;
      let frame = null;
      const f = (n) => n.toFixed(2);
      const transform = (element, value) => element.setAttribute('transform', value);

      // Two-bone inverse kinematics keeps each foot attached to its pedal.
      function drawLeg(leg, angle, rear) {
        const hip = { x: rear ? 562 : 576, y: 502 };
        const ankle = { x: 600 + Math.cos(angle) * 29, y: 634 + Math.sin(angle) * 29 };
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 91, lower = 94;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * bend / distance, y: hip.y + dy * along / distance - dx * bend / distance };
        const path = `M${hip.x} ${hip.y}L${f(knee.x)} ${f(knee.y)}L${f(ankle.x)} ${f(ankle.y)}`;
        leg.outline.setAttribute('d', path);
        leg.line.setAttribute('d', path);
        leg.foot.setAttribute('d', `M${f(ankle.x - 7)} ${f(ankle.y - 6)}Q${f(ankle.x + 1)} ${f(ankle.y - 1)} ${f(ankle.x + 12)} ${f(ankle.y - 4)}L${f(ankle.x + 27)} ${f(ankle.y + 7)}Q${f(ankle.x + 11)} ${f(ankle.y + 11)} ${f(ankle.x - 8)} ${f(ankle.y + 5)}Z`);
        leg.pedal.setAttribute('d', `M${f(ankle.x - 13)} ${f(ankle.y + 11)}h38`);
      }

      function render() {
        const angle = elapsed * Math.PI * 2 / 1.55;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 1.6;
        transform(parts['rear-wheel'], `rotate(${f(degrees)})`);
        transform(parts['front-wheel'], `rotate(${f(degrees)})`);
        transform(parts.crank, `rotate(${f(degrees)} 600 640)`);
        transform(parts.rider, `translate(0 ${f(bob)})`);
        parts.shadow.setAttribute('rx', f(282 + bob * 1.4));
        drawLeg(legs[0], angle + Math.PI, true);
        drawLeg(legs[1], angle, false);
        transform(parts['scarf-tail-back'], `rotate(${f(Math.sin(angle * 1.5) * 4)} 604 349)`);
        transform(parts['scarf-tail-front'], `rotate(${f(Math.sin(angle * 1.5 + 1) * 6)} 604 352)`);
        for (const [id, rate] of [['clouds', 9], ['water', 28], ['plants', 160], ['road', 101 * Math.PI * 2 / 1.55], ['front-plants', 240]]) {
          transform(parts[id], `translate(${f(-(elapsed * rate % 1440))} 0)`);
        }
      }

      function tick(now) {
        frame = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, 0.08) * speed;
        previous = now;
        render();
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        toggle.dataset.paused = String(paused);
        toggle.title = paused ? '播放' : '暂停';
        toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      function fitScene() {
        const width = window.innerWidth, height = window.innerHeight;
        const ratio = width / height;
        if (ratio < 0.8) {
          const viewWidth = Math.max(710, width * 550 / Math.max(160, height - 260));
          const viewHeight = viewWidth / ratio;
          const top = Math.max(460 - viewHeight * 0.47, 761 - (height - 190) * viewWidth / width);
          scene.setAttribute('viewBox', `${f(710 - viewWidth / 2)} ${f(top)} ${f(viewWidth)} ${f(viewHeight)}`);
        } else {
          const viewWidth = Math.max(1130, 900 * ratio);
          const viewHeight = viewWidth / ratio;
          scene.setAttribute('viewBox', `${f(720 - viewWidth / 2)} ${f(450 - viewHeight / 2)} ${f(viewWidth)} ${f(viewHeight)}`);
        }
      }

      toggle.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed}×`;
        speedInput.setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      byId('restart').addEventListener('click', () => { elapsed = 0; previous = null; render(); });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', event => { paused = event.matches; syncPlayback(); });
      window.addEventListener('resize', fitScene);
      fitScene();
      render();
      syncPlayback();
    })();
  </script>
</body>
</html>
