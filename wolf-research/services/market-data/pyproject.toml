[project]
name = "wolf-research-market-data"
version = "0.1.0"
description = "Wolf Research market data service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
wolf-research-market-api = "quantpilot_market_data.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpilot_market_data"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
