name: wolfbot-parser
services:
  document-parser:
    build: ./services/document-parser
    image: wolfbot-document-parser:dev
    ports:
      - "127.0.0.1:${DOCUMENT_PARSER_PORT:-7821}:7821"
    environment:
      DOCUMENT_PARSER_TOKEN: ${DOCUMENT_PARSER_TOKEN:-local-development-parser}
      DOCUMENT_PARSER_MODELS: /models
      DOCUMENT_PARSER_CACHE: /cache
    volumes:
      - ./data/document-parser/models:/models:ro
      - ./data/document-parser/cache:/cache
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import os,urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:7821/health',headers={'Authorization':'Bearer '+os.environ['DOCUMENT_PARSER_TOKEN']}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
