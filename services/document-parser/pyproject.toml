[project]
name = "wolfbot-document-parser"
version = "0.1.0"
description = "Local versioned PDF, OCR and financial table parser"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling>=2.60,<3",
  "rapidocr>=3.4,<4",
  "onnxruntime>=1.22,<2",
  "fastapi>=0.124,<1",
  "uvicorn>=0.35,<1",
  "httpx[socks]>=0.28,<1",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
