<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸假日</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#263f43;font-family:"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px 5vw 24px}header,footer{display:flex;justify-content:space-between;align-items:center}header{border-bottom:1px solid #263f4325;padding-bottom:22px}.brand{font-size:14px;font-weight:700;letter-spacing:3px}.edition{font:12px monospace;letter-spacing:2px}.intro{text-align:center;margin:38px 0 12px}.intro small{color:#ba6345;font:11px monospace;letter-spacing:4px}h1{font-size:clamp(28px,4vw,48px);font-weight:500;letter-spacing:5px;margin:12px 0}.intro p{font-size:13px;color:#748181;letter-spacing:2px}.frame{overflow:hidden;border-radius:160px 160px 20px 20px;border:1px solid #263f431c;background:#d7e9e6}svg.scene{display:block;width:100%;height:auto}footer{padding-top:22px;gap:20px}.note{font-size:12px;color:#748181;line-height:1.8}.controls{display:flex;align-items:center;gap:12px}button{border:1px solid #263f4330;background:transparent;color:#263f43;padding:11px 18px;border-radius:24px;font:inherit;font-size:12px;cursor:pointer}button:hover{background:#e6eae0}button:focus-visible{outline:3px solid #cf7859;outline-offset:3px}.tag{font:10px monospace;letter-spacing:2px;color:#a26f50}@media(max-width:600px){main{padding:24px 20px}.edition{display:none}.intro{margin:30px 0 22px}.frame{border-radius:80px 80px 16px 16px}.scene{min-height:360px;object-fit:cover}footer{align-items:flex-start}.tag{display:none}}
</style>
</head>
<body>
<main>
  <header><span class="brand">沿海慢行俱乐部</span><span class="edition">THE SLOW COAST CLUB / VOL. 01</span></header>
  <div class="intro"><small>A LITTLE RIDE, A LOVELY DAY</small><h1>让海风，慢一点。</h1><p>一只鹈鹕，一辆单车，一整个无所事事的下午。</p></div>
  <div class="frame">
  <svg class="scene" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">鹈鹕的海岸假日</title><desc id="desc">白色鹈鹕戴着绿色帽子，骑着橘红自行车沿海岸前行，双脚踩动踏板，车轮旋转，围巾随风飘动。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d5e7e4"/><stop offset="1" stop-color="#eef0dc"/></linearGradient>
      <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#86b9b4"/><stop offset="1" stop-color="#bed8c6"/></linearGradient>
      <pattern id="waves" width="180" height="43" patternUnits="userSpaceOnUse"><path d="M20 22h48m36 9h24" fill="none" stroke="#eef4df" stroke-width="3" stroke-linecap="round"/></pattern>
      <g id="cloud" fill="#fbf7e8"><path d="M0 25C-3 11 17 2 31 12C37-10 74-9 82 12C104 1 120 13 121 25Z"/></g>
      <g id="wheel"><circle r="82" fill="#f7f0d7" fill-opacity=".35" stroke="#29474a" stroke-width="10"/><circle r="73" fill="none" stroke="#fff5da" stroke-width="3"/><g stroke="#658884" stroke-width="2"><path d="M-71 0H71M0-71V71M-50-50L50 50M-50 50L50-50M-27-66L27 66M-66-27L66 27M-66 27L66-27M-27 66L27-66"/></g><circle r="9" fill="#29474a"/><path d="M-9-72H9" stroke="#d99556" stroke-width="4"/></g>
      <g id="grass" fill="none" stroke="#7f9270" stroke-width="3" stroke-linecap="round"><path d="M0 0l-8-18M0 0l6-26M0 0l16-13"/></g>
    </defs>
    <path fill="url(#sky)" d="M0 0h1200v640H0z"/>
    <circle cx="911" cy="129" r="58" fill="#f8dda1"/><circle cx="911" cy="129" r="73" fill="none" stroke="#f6e5b7" stroke-opacity=".5"/>
    <g id="clouds"><use href="#cloud" x="130" y="110"/><use href="#cloud" transform="translate(565 74) scale(.65)"/><use href="#cloud" transform="translate(1030 205) scale(.8)"/></g>
    <path d="M0 320Q120 258 243 308T487 308Q592 245 733 314T1010 300T1200 314V403H0Z" fill="#b0cbc1"/>
    <path d="M0 344H1200V485H0Z" fill="url(#sea)"/>
    <g id="water"><path d="M-180 355H1380V471H-180Z" fill="url(#waves)"/></g>
    <g transform="translate(991 301)"><path d="M0 44h55l-9 11H12Z" fill="#557e79"/><path d="M27-32v73H-8Z" fill="#fbf4dc"/><path d="M32-10v51h24Z" fill="#e6bf87"/></g>
    <g fill="none" stroke="#527976" stroke-width="2.5" stroke-linecap="round"><path d="M765 174q10-11 20 0q10-11 20 0M819 215q7-8 14 0q7-8 14 0"/></g>
    <path d="M0 459Q250 435 491 461T1200 446V640H0Z" fill="#e8d8ad"/>
    <path d="M0 510Q590 490 1200 512V599Q590 576 0 600Z" fill="#f7ebcd"/>
    <path d="M0 604Q590 580 1200 603" fill="none" stroke="#cdbf97" stroke-width="2"/>
    <g id="road" fill="none" stroke="#cfbd91" stroke-width="3" stroke-linecap="round"><path d="M-200 560h55M40 560h55M280 560h55M520 560h55M760 560h55M1000 560h55M1240 560h55"/></g>
    <g id="plants"><use href="#grass" x="112" y="495"/><use href="#grass" x="970" y="485"/><use href="#grass" x="1140" y="627"/><use href="#grass" x="305" y="617"/><g fill="#c5a57b"><ellipse cx="190" cy="480" rx="8" ry="3"/><ellipse cx="842" cy="615" rx="13" ry="4"/></g></g>
    <ellipse cx="593" cy="542" rx="244" ry="14" fill="#8b977d" opacity=".18"/>
    <g id="rider">
      <g transform="translate(433 447)"><g id="rearWheel"><use href="#wheel"/></g></g>
      <g transform="translate(752 447)"><g id="frontWheel"><use href="#wheel"/></g></g>
      <path id="farLeg" fill="none" stroke="#bb793f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M431 447L509 327L581 447H431L699 336L752 447M509 327H691M581 447L503 307" fill="none" stroke="#bb5944" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M433 447L509 327L581 447M509 327H691" fill="none" stroke="#ee9970" stroke-width="3" stroke-linecap="round"/>
      <path d="M699 336l-16-57q-5-17 10-19l31-3" fill="none" stroke="#29474a" stroke-width="8" stroke-linecap="round"/>
      <path d="M716 258h18" stroke="#c48856" stroke-width="12" stroke-linecap="round"/>
      <path d="M487 305h45" stroke="#29474a" stroke-width="13" stroke-linecap="round"/>
      <path d="M369 395Q430 348 486 396M699 386Q752 355 806 397" fill="none" stroke="#d88a61" stroke-width="6" stroke-linecap="round"/>
      <circle cx="581" cy="447" r="24" fill="#f5deb0" stroke="#29474a" stroke-width="4"/>
      <g id="crank" stroke="#29474a" stroke-width="6" stroke-linecap="round"><path id="crankLine"/></g>
      <g id="bird">
        <path d="M494 264Q449 246 422 217Q428 268 475 285" fill="#eeeada" stroke="#29474a" stroke-width="3"/>
        <path d="M480 224C504 199 554 202 584 228C614 250 606 286 568 305C531 325 482 306 472 279C464 259 468 240 480 224Z" fill="#fffcf0" stroke="#29474a" stroke-width="3"/>
        <path d="M505 238Q534 218 565 250Q548 276 513 274Q527 263 529 251" fill="#e2e5d9" stroke="#849891" stroke-width="2" stroke-linecap="round"/>
        <path d="M568 245C599 222 575 185 585 146C593 116 633 109 650 131C666 153 653 177 634 182C620 186 627 213 617 237Q600 273 575 280" fill="#fffcf0" stroke="#29474a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M641 158L778 170Q756 191 700 193Q661 192 641 168Z" fill="#e4ac59" stroke="#29474a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M640 153Q704 151 779 170L642 168Z" fill="#f5c570" stroke="#29474a" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="632" cy="144" r="5" fill="#29474a"/><circle cx="633" cy="142" r="1.4" fill="white"/>
        <path d="M606 121q-3-39 29-34q23 2 22 34" fill="#507d6b" stroke="#29474a" stroke-width="3"/><path d="M595 122q33-10 72 1" fill="none" stroke="#29474a" stroke-width="7" stroke-linecap="round"/>
        <path id="scarf" d="M600 205Q560 180 532 197L510 179L510 203Q551 225 600 217Z" fill="#c96549" stroke="#a8503d" stroke-width="2"/>
        <path d="M590 199l30 7l-6 14l-27-9Z" fill="#d97e57"/>
        <path d="M575 245Q618 267 663 262L719 259" fill="none" stroke="#29474a" stroke-width="15" stroke-linecap="round"/><path d="M575 243Q619 263 663 259L715 256" fill="none" stroke="#f9f6e9" stroke-width="11" stroke-linecap="round"/>
      </g>
      <path id="nearLeg" fill="none" stroke="#e2a24e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" fill="#efb95d" stroke="#29474a" stroke-width="2" stroke-linejoin="round"/>
      <path id="pedals" stroke="#29474a" stroke-width="7" stroke-linecap="round"/>
      <circle cx="581" cy="447" r="6" fill="#29474a"/>
    </g>
    <g stroke="#fff9e7" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M340 277h-33M359 298h-58M330 318h-21"/></g>
    <text x="53" y="592" fill="#a18c66" font-size="10" font-family="monospace" letter-spacing="3">COASTLINE / 08:30 AM</text>
  </svg>
  </div>
  <footer><div class="note">今日行程：沿着海岸，一直向前。<br><span class="tag">NO HURRY. JUST KEEP PEDALING.</span></div><div class="controls"><button id="pause" type="button" aria-pressed="false">暂停动画</button><button id="speed" type="button" aria-label="切换骑行速度">速度 ×1</button></div></footer>
</main>
<script>
  const el = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduceMotion.matches, speed = 1, time = 0, last = null;
  function syncButton(){el('pause').textContent = paused ? '播放动画' : '暂停动画';el('pause').setAttribute('aria-pressed',String(paused));}
  syncButton();
  el('pause').onclick = () => {paused = !paused;syncButton();};
  el('speed').onclick = () => {speed = speed === 1 ? 1.5 : speed === 1.5 ? .65 : 1;el('speed').textContent = '速度 ×' + speed;};
  function draw(t){
    const a=t*3.8, x=581+34*Math.cos(a), y=447+34*Math.sin(a), bx=1162-x, by=894-y;
    el('rearWheel').setAttribute('transform',`rotate(${t*160})`);
    el('frontWheel').setAttribute('transform',`rotate(${t*160})`);
    el('rider').setAttribute('transform',`translate(0 ${Math.sin(a*2)*1.4})`);
    el('nearLeg').setAttribute('d',`M550 301 Q${595+Math.cos(a)*12} 343 ${x} ${y}`);
    el('farLeg').setAttribute('d',`M531 303 Q${527-Math.cos(a)*13} 356 ${bx} ${by}`);
    el('crankLine').setAttribute('d',`M${bx} ${by}L${x} ${y}`);
    el('nearFoot').setAttribute('d',`M${x-8} ${y-8}Q${x+4} ${y-13} ${x+23} ${y-2}L${x+24} ${y+3}H${x-9}Z`);
    el('pedals').setAttribute('d',`M${x-12} ${y+6}h36M${bx-13} ${by+6}h29`);
    el('scarf').setAttribute('d',`M600 205Q560 ${185+Math.sin(a)*8} 532 ${195+Math.sin(a+1)*9}L508 ${180+Math.sin(a+1)*9}L512 ${205+Math.sin(a+1)*9}Q552 ${224+Math.sin(a)*6} 600 217Z`);
    el('road').setAttribute('transform',`translate(${-t*100%240} 0)`);
    el('water').setAttribute('transform',`translate(${-t*14%180} 0)`);
    el('clouds').setAttribute('transform',`translate(${Math.sin(t*.07)*36} 0)`);
  }
  function frame(now){if(last!==null&&!paused)time+=Math.min((now-last)/1000,.05)*speed;last=now;draw(time);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
</script>
</body>
</html>
